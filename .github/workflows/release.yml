name: Tests en release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installeer Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Draai alle labtests
        run: python3 extract_labs.py

  release:
    # Alleen bij een tag zoals v1.0.0: bouw de PDF's en zet ze bij de release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installeer pandoc en Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb
      - name: Bouw de PDF's
        run: ./build.sh
        env:
          CHROME_FLAGS: --no-sandbox
      - name: Controleer dat alle PDF's er zijn
        run: test "$(ls pdf/*.pdf | wc -l)" -eq 32
      - name: Maak een zip
        run: cd pdf && zip ../cpu-design-cursus-pdf.zip *.pdf
      - name: Maak de release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" pdf/*.pdf cpu-design-cursus-pdf.zip \
            --title "${{ github.ref_name }}" \
            --notes "PDF's van de cursus (syllabus, 30 weken en bijlagen), gebouwd uit de bronbestanden in deze tag."
